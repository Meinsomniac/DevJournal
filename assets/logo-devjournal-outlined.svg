<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark rounded background -->
  <rect width="512" height="512" rx="112" fill="#0A0A0A"/>

  <!-- Outlined "J" composed of page-like vertical lines (journal motif) -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Spine / left edge -->
    <path d="M148 96 L148 416" stroke-width="28" opacity="0.9"/>
    <!-- Page curve -->
    <path d="M148 96 C260 96 364 140 364 256 C364 372 260 416 148 416" stroke-width="28"/>
    <!-- Top page fold accent -->
    <path d="M148 180 C240 180 276 212 276 256" stroke-width="14" opacity="0.6"/>
  </g>

  <!-- Inner border frame for "outlined" style -->
  <rect x="36" y="36" width="440" height="440" rx="76" stroke="#FFFFFF" stroke-width="8" fill="none" opacity="0.15"/>

  <!-- Small "D" dot / accent -->
  <circle cx="280" cy="256" r="14" fill="#6366F1"/>
</svg>
