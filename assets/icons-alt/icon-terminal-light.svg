<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Light theme background -->
  <rect width="512" height="512" rx="112" fill="#dbdbd7"/>
  <!-- Terminal window using light card tones -->
  <rect x="80" y="112" width="352" height="288" rx="24" fill="#cfcfc9" stroke="#c1c1be" stroke-width="8"/>
  <!-- Title bar dots -->
  <circle cx="120" cy="152" r="12" fill="#993333"/>
  <circle cx="156" cy="152" r="12" fill="#af8842"/>
  <circle cx="192" cy="152" r="12" fill="#577c5c"/>
  <!-- Content lines -->
  <rect x="112" y="208" width="200" height="20" rx="10" fill="#666666" opacity="0.5"/>
  <rect x="112" y="244" width="160" height="20" rx="10" fill="#666666" opacity="0.5"/>
  <rect x="112" y="280" width="240" height="20" rx="10" fill="#666666" opacity="0.5"/>
  <!-- Blinking cursor in brandSecondary warm taupe -->
  <rect x="112" y="340" width="16" height="32" rx="4" fill="#998466">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="140" y="370" font-family="'SF Mono', 'Fira Code', monospace" font-size="28" font-weight="600" fill="#262626">devjournal</text>
</svg>
