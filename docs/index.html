<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevJournal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f13;
      color: #e4e4e7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      max-width: 480px;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #a78bfa, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #a1a1aa;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .links {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }
    a {
      color: #e4e4e7;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      background: #1a1a24;
      border: 1px solid #27272a;
      font-weight: 500;
      transition: background 0.2s, border-color 0.2s;
    }
    a:hover {
      background: #27272a;
      border-color: #a78bfa;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>DevJournal</h1>
    <p>Your daily developer news digest. Curated feeds, smart filtering, and personalised insights for engineers who want to stay ahead.</p>
    <div class="links">
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Service</a>
    </div>
  </div>
</body>
</html>
