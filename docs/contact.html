<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us — DevJournal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f13;
      color: #e4e4e7;
      line-height: 1.7;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    p {
      color: #d4d4d8;
      margin-bottom: 0.75rem;
    }
    .contact-card {
      background: #1a1a24;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 1.5rem;
      margin: 1.5rem 0;
    }
    .contact-card p {
      margin-bottom: 0.5rem;
    }
    .contact-card .label {
      color: #a1a1aa;
      font-size: 0.875rem;
    }
    a { color: #a78bfa; }
    .back {
      display: inline-block;
      margin-top: 2rem;
      color: #a1a1aa;
      text-decoration: none;
      font-size: 0.875rem;
    }
    .back:hover { color: #e4e4e7; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Contact Us</h1>
    <p>We'd love to hear from you. Reach out with questions, feedback, or support requests.</p>

    <div class="contact-card">
      <p class="label">Email</p>
      <p><a href="mailto:labs.distill@gmail.com">labs.distill@gmail.com</a></p>
    </div>

    <a href="index.html" class="back">← Back to Home</a>
  </div>
</body>
</html>
